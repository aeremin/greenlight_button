# Debug build: a shell on RTT with "gl" commands that act like the button.
# It polls RTT every 10 ms, so leave it out of builds that run on a coin cell:
#   west build -b radioland_beacon firmware/beacon -- -DEXTRA_CONF_FILE=debug.conf

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_VT100_COLORS=n

# The shell carries the logs, so the plain RTT log backend would print them twice
CONFIG_LOG_BACKEND_RTT=n

# A Black Magic Probe older than v2.1 halts the CPU for each RTT poll on nRF52,
# which makes radio events start late. Skip those events instead of halting.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y

# Let "gl scan" see Bluetooth 5 extended advertising too
CONFIG_BT_EXT_ADV=y

# Pairing and encryption details, with room to buffer them between slow RTT polls
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
