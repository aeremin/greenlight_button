CONFIG_GPIO=y
CONFIG_INPUT=y

# Central that connects to the GoPro and FlySight, both at once
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
# A sleeping FlySight advertises every 2.5 s; give a connection one missed advert of slack
CONFIG_BT_CREATE_CONN_TIMEOUT=6
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="Greenlight"
# Development asserts for code coverage. One fires on a long connection event
# with the FlySight and halts the system; the controller copes without it.
CONFIG_BT_CTLR_ASSERT_DEBUG=n

# Both devices need a bonded, encrypted link. One spare bond slot lets a
# re-pairing finish before the old bond is dropped.
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=3
# The GoPro only offers legacy pairing, which Zephyr refuses by default
CONFIG_BT_SMP_SC_PAIR_ONLY=n
# Hand peers an identity key and use private addresses, like a phone. Without it
# Zephyr distributes no identity, and the GoPro won't encrypt with the bond later.
CONFIG_BT_PRIVACY=y

# Bonds and peer roles live in the storage partition
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_MAIN_STACK_SIZE=2048
# Connection callbacks can drop a bond, which writes flash
CONFIG_BT_RX_STACK_SIZE=2048

# Log over SEGGER RTT: the board has no UART pads
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
