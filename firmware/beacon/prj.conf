CONFIG_GPIO=y
CONFIG_INPUT=y

# Central that connects to the GoPro and FlySight, both at once
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="Greenlight"

# Both devices need a bonded, encrypted link. One spare bond slot lets a
# re-pairing finish before the old bond is dropped.
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=3

# Bonds and peer roles live in the storage partition
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_MAIN_STACK_SIZE=2048
# Connection callbacks can drop a bond, which writes flash
CONFIG_BT_RX_STACK_SIZE=2048

# Log over SEGGER RTT: the board has no UART pads
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
